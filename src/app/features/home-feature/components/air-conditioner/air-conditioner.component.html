<div class="air-conditioner">
  <div class="heading">
     <div class="name">
      <h3>Air Conditioner</h3>
      <p>Sharp 209-KY</p>
     </div>
     <app-toggle-switch (switch)="switchOnOff($event)"></app-toggle-switch>
  </div>

  <div class="air-control">
    <input class="volume-range" orient="vertical" type="range" step="0.5" value="5" min="1" max="10">
  </div>

  <div class="fan-control">

  </div>
</div>
